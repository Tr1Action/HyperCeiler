name: TR Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "doc/**"
      - "docs/**"
      - "imgs/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: tr-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    name: Build APK
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create signing.properties
        run: |
          {
            echo "storeFile=../tr1action.jks"
            echo "storePassword=tr1action"
            echo "keyAlias=tr1action"
            echo "keyPassword=tr1action"
          } > signing.properties
          echo "GIT_ACTOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "GIT_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Build (Canary)
        run: ./gradlew assembleCanary

      - name: Find APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/canary -name '*.apk' | head -n 1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-TR
          path: ${{ env.APK_FILE }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="tr-${{ github.run_number }}"
          cp "$APK_FILE" "HyperCeiler-TR-${{ github.run_number }}.apk"
          gh release create "$TAG" "HyperCeiler-TR-${{ github.run_number }}.apk" \
            --title "HyperCeiler TR #${{ github.run_number }}" \
            --notes "Türkçe sürüm, otomatik derleme." \
            --target "${{ github.sha }}"
